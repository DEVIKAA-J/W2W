        byId('dot3').classList.add('active');
      }
    }

    function renderPills() {
      byId('languageRow').innerHTML = '';
      byId('contentTypeRow').innerHTML = '';
      byId('durationRow').innerHTML = '';

      LANGUAGES.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill-btn';
        b.textContent = o.name;
        if (o.id === selectedLanguage) b.classList.add('active');
        b.onclick = () => {
          selectedLanguage = o.id;
          renderPills();
          updateSelectedTag();
        };
        byId('languageRow').appendChild(b);
      });

      CONTENT_TYPES.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill-btn';
        b.textContent = o.name;
        if (o.id === selectedContentType) b.classList.add('active');
        b.onclick = () => {
          selectedContentType = o.id;
          if (o.id === 'movie' || o.id === 'tv') selectedType = o.id;
          renderPills();
          updateSelectedTag();
        };
        byId('contentTypeRow').appendChild(b);
      });

      DURATIONS.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill-btn';
        b.textContent = o.name;
        if (o.id === selectedDuration) b.classList.add('active');
        b.onclick = () => {
          selectedDuration = o.id;
          renderPills();
          updateSelectedTag();
        };
        byId('durationRow').appendChild(b);
      });
    }

    function updateSelectedTag() {
      byId('selectedFiltersTag').textContent =
        `${selectedLanguage === 'all' ? 'Any language' : LANGUAGES.find(x => x.id === selectedLanguage).name} · ` +
        `${selectedContentType === 'any' ? 'Any type' : CONTENT_TYPES.find(x => x.id === selectedContentType).name} · ` +
        `${selectedDuration === 'any' ? 'Any duration' : DURATIONS.find(x => x.id === selectedDuration).name}`;
    }

    function renderMoods() {
      const grid = byId('moodGrid');
      grid.innerHTML = '';
      MOODS.forEach(m => {
        const card = document.createElement('button');
        card.className = 'mood-card';
        card.dataset.id = m.id;
        card.innerHTML = `
          <span class="mood-emoji">${m.emoji}</span>
          <span class="mood-name">${m.name}</span>
          <span class="mood-desc">${m.desc}</span>
        `;
        card.addEventListener('click', () => selectMood(m));
        grid.appendChild(card);
      });
    }

    function renderVibes(vibeIds) {
      const grid = byId('vibeGrid');
      grid.innerHTML = '';
      vibeIds.forEach((id, i) => {
        const v = VIBES[id];
        if (!v) return;
        const card = document.createElement('button');
        card.className = 'vibe-card';
        card.dataset.id = id;
        card.style.animationDelay = `${i * 0.06}s`;
        card.innerHTML = `
          <span class="vibe-emoji">${v.emoji}</span>
          <span class="vibe-name">${v.name}</span>
          <span class="vibe-combo">${v.combo}</span>
        `;
        card.addEventListener('click', () => selectVibe(id, card));
        grid.appendChild(card);
      });
    }

    function goToStep1() {
      selectedMood = null;
      selectedVibe = null;
      byId('stepMoodSection').style.display = 'block';
      byId('stepVibeSection').style.display = 'none';
      byId('resultsSection').style.display = 'none';
      byId('stepIndicator').style.display = 'flex';
      byId('pickBtn').style.display = 'none';
      hideError();
      setStep(1);
    }

    function goToStep2(mood) {
      byId('selectedMoodTag').textContent = `${mood.emoji} ${mood.name}`;
      document.querySelectorAll('.mood-card').forEach(c => c.classList.remove('active'));
      document.querySelector(`.mood-card[data-id="${mood.id}"]`)?.classList.add('active');
      byId('stepMoodSection').style.display = 'none';
      byId('stepVibeSection').style.display = 'block';
      byId('resultsSection').style.display = 'none';
      byId('pickBtn').style.display = 'none';
      hideError();
      setStep(2);
    }

    function selectMood(mood) {
      selectedMood = mood;
      renderVibes(mood.vibes);
      goToStep2(mood);
    }

    function selectVibe(id, el) {
      selectedVibe = id;
      document.querySelectorAll('.vibe-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const pickBtn = byId('pickBtn');
      if (!VIBES[id]) {
        showError('Something went wrong with this genre blend. Try another.');
        return;
      }
      pickBtn.style.display = 'block';
      setTimeout(() => pickBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }

    function showError(msg) {
      const box = byId('errBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      byId('errBox').style.display = 'none';
    }

    function buildDiscoverUrl() {
      const vibe = VIBES[selectedVibe];
      const type = selectedContentType === 'movie' || selectedContentType === 'tv' ? selectedContentType : selectedType;
      const base = `https://api.themoviedb.org/3/discover/${selectedContentType === 'anime' ? 'tv' : type}`;
      const params = new URLSearchParams({
        api_key: API_KEY,
        with_genres: vibe.genres,
        include_adult: 'false',
        sort_by: 'popularity.desc',
        page: '1'
      });

      if (selectedLanguage !== 'all') {
        params.set('with_original_language', selectedLanguage);
      }

      if (selectedDuration !== 'any' && (type === 'movie' || selectedContentType === 'anime')) {
        const d = DURATIONS.find(x => x.id === selectedDuration);
        params.set('with_runtime.gte', String(d.min));
        if (d.max < 999) params.set('with_runtime.lte', String(d.max));
      }

      if (selectedContentType === 'anime') {
        params.set('with_genres', '16,12');
      }

      return `${base}?${params.toString()}`;
    }

    async function fetchResults() {
      if (!selectedVibe) return;
      const vibe = VIBES[selectedVibe];
      if (!vibe || !vibe.genres) {
        showError('Please select a valid genre blend.');
        return;
      }

      hideError();
      const btn = byId('pickBtn');
      const btnText = byId('pickBtnText');
      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Finding your picks…';

      try {
        const url = buildDiscoverUrl();
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          showError(data.status_message || `TMDB error ${res.status}`);
          return;
        }

        const results = Array.isArray(data.results) ? data.results.slice(0, 12) : [];
        if (!results.length) {
          showError('No titles found for this blend.');
          return;
        }

        displayResults(results, vibe);
        goToStep3();
      } catch (e) {
        console.error(e);
        showError('Fetch failed. Check console for details.');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Find My Picks ✦';
      }
    }

    function displayResults(results, vibe) {
      const grid = byId('resultsGrid');
      byId('resultsTitle').textContent = `${vibe.emoji} ${vibe.name} picks`;
      byId('resultsCount').textContent = `${results.length} results`;
      grid.innerHTML = '';

      results.forEach((item, i) => {
        const title = item.title || item.name || 'Untitled';
        const date = (item.release_date || item.first_air_date || '').slice(0, 4) || '—';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
        const overview = item.overview || 'No description available.';
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : '';

        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-poster-wrap">
            ${poster ? `<img class="result-poster" src="${poster}" alt="${title} poster" loading="lazy">` : `<div class="result-poster-placeholder">🎬</div>`}
          </div>
          <div class="result-body">
            <div class="result-rank">#${i + 1} pick</div>
            <h3 class="result-title">${title}</h3>
            <p class="result-meta">${date} · ${selectedContentType === 'tv' ? 'TV Show' : selectedContentType === 'anime' ? 'Anime' : 'Movie'}</p>
            <div class="result-rating">★ ${rating}</div>
            <p class="result-overview">${overview}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function goToStep3() {
      byId('stepMoodSection').style.display = 'none';
      byId('stepVibeSection').style.display = 'none';
      byId('stepIndicator').style.display = 'none';
      byId('resultsSection').style.display = 'block';
      setStep(3);
    }

    byId('openWizardBtn').onclick = () => {
      showPage('wizardPage');
      renderMoods();
      renderPills();
      updateSelectedTag();
      goToStep1();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    byId('backHomeBtn').onclick = () => showPage('homePage');
    byId('backBtn').onclick = () => goToStep1();
    byId('pickBtn').onclick = fetchResults;
    byId('startOverBtn').onclick = () => goToStep1();

    renderMoods();
    renderPills();
    updateSelectedTag();
    goToStep1();
  </script>
</body>
</html>
